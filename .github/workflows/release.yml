name: Release Windows package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # The Corel extension build needs the CorelDRAW SDK/assemblies and OpenCV
    # installed on a private Windows runner. Keep these paths out of the repo.
    runs-on: [self-hosted, windows, corel]
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches desktop version
        shell: pwsh
        run: |
          $manifest = Get-Content crates/cdr-desktop/Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^\"]+)"').Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag must be v$version, got ${{ github.ref_name }}" }
      - name: Build portable package
        shell: pwsh
        run: .\scripts\build-portable.ps1
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: CDR 巡边工具 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/portable/*-Windows-x64.zip
            target/portable/SHA256SUMS.txt
