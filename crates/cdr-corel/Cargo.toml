[package]
name = "cdr-corel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
cdr-domain = { path = "../cdr-domain" }
cdr-raster = { path = "../cdr-raster" }
geo = "0.31"
image = { version = "0.25.5", default-features = false, features = ["png"] }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"

[features]
opencv = ["cdr-raster/opencv"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
