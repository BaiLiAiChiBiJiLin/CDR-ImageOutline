[package]
name = "cdr-raster"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cdr-domain = { path = "../cdr-domain" }
image = { version = "0.25.5", default-features = false, features = ["png"] }
geo = "0.31"
contour = "0.13"
imageproc = { version = "0.25", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
opencv = { version = "0.100.1", default-features = false, features = ["imgproc"], optional = true }

[features]
default = []
opencv = ["dep:opencv"]
